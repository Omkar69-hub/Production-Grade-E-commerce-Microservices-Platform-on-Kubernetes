# ==============================================================================
# LUMIÈRE — Staging Backend Orchestration (ARM64 & OCI Ampere A1 Compatible)
# Target Architecture: Cloudflare Pages (Frontend) + OCI Always Free (Backend)
#
# IMPORTANT:
# - Loads configuration from untracked .env.staging (template: .env.staging.example)
# - No hardcoded secrets, tokens, or default credentials.
# - PostgreSQL, Redis, and RabbitMQ have NO public host ports exposed.
# - MailHog is replaced with Mailpit (native ARM64/AMD64 multi-architecture).
# - API Gateway binds to loopback (127.0.0.1) by default for Cloudflare Tunnel / Nginx.
# - Frontend is hosted on Cloudflare Pages and is NOT run in this Compose stack.
# ==============================================================================

services:

  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: staging-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env.staging}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      - staging-infrastructure-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: always
    command:
      - sh
      - -c
      - |
        set +x
        umask 077
        touch /tmp/redis.conf
        chmod 600 /tmp/redis.conf
        echo "requirepass $$(cat /run/secrets/redis_password)" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redis-staging-data:/data
    secrets:
      - redis_password
    networks:
      - staging-infrastructure-network
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep PONG || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: staging-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env.staging}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env.staging}
    volumes:
      - rabbitmq-staging-data:/var/lib/rabbitmq
    networks:
      - staging-infrastructure-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 15s
      timeout: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: staging-mailpit
    restart: always
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    ports:
      # Optional: Web UI bound strictly to loopback on host for staging verification
      - "${MAILPIT_BIND_IP:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - staging-infrastructure-network

  # ============================================================================
  # BACKEND MICROSERVICES
  # ============================================================================

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: ecommerce/auth-service:staging
    container_name: staging-auth-service
    restart: always
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-None}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_PATH=${COOKIE_PATH:-/api/v1/auth}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    networks:
      - staging-backend-network
      - staging-infrastructure-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  product-service:
    build:
      context: ..
      dockerfile: services/product-service/Dockerfile
    image: ecommerce/product-service:staging
    container_name: staging-product-service
    restart: always
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=product_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${PRODUCT_RABBITMQ_USER:-${RABBITMQ_USER:?RABBITMQ_USER must be set}}
      - RABBITMQ_PASSWORD=${PRODUCT_RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    networks:
      - staging-backend-network
      - staging-infrastructure-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  cart-service:
    build:
      context: ..
      dockerfile: services/cart-service/Dockerfile
    image: ecommerce/cart-service:staging
    container_name: staging-cart-service
    restart: always
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=cart_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${CART_RABBITMQ_USER:-${RABBITMQ_USER:?RABBITMQ_USER must be set}}
      - RABBITMQ_PASSWORD=${CART_RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - PRODUCT_SERVICE_URL=http://product-service:8080
      - ENABLE_INTERNAL_CHECKOUT=false
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    networks:
      - staging-backend-network
      - staging-infrastructure-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    image: ecommerce/order-service:staging
    container_name: staging-order-service
    restart: always
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=order_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${ORDER_RABBITMQ_USER:-${RABBITMQ_USER:?RABBITMQ_USER must be set}}
      - RABBITMQ_PASSWORD=${ORDER_RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - PRODUCT_SERVICE_URL=http://product-service:8080
      - CART_SERVICE_URL=http://cart-service:8080
      - ENABLE_INTERNAL_CHECKOUT=false
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    networks:
      - staging-backend-network
      - staging-infrastructure-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    image: ecommerce/payment-service:staging
    container_name: staging-payment-service
    restart: always
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=payment_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${PAYMENT_RABBITMQ_USER:-${RABBITMQ_USER:?RABBITMQ_USER must be set}}
      - RABBITMQ_PASSWORD=${PAYMENT_RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ENABLE_INTERNAL_CHECKOUT=false
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    networks:
      - staging-backend-network
      - staging-infrastructure-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    image: ecommerce/notification-service:staging
    container_name: staging-notification-service
    restart: always
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=notification_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${NOTIFICATION_RABBITMQ_USER:-${RABBITMQ_USER:?RABBITMQ_USER must be set}}
      - RABBITMQ_PASSWORD=${NOTIFICATION_RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}}
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    networks:
      - staging-backend-network
      - staging-infrastructure-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    image: ecommerce/api-gateway:staging
    container_name: staging-api-gateway
    restart: always
    environment:
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - PRODUCT_SERVICE_URL=http://product-service:8080
      - CART_SERVICE_URL=http://cart-service:8080
      - ORDER_SERVICE_URL=http://order-service:8080
      - PAYMENT_SERVICE_URL=http://payment-service:8080
      - ENABLE_INTERNAL_CHECKOUT=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseZGC -Xms128m -Xmx256m}
    ports:
      # Bound to loopback (127.0.0.1) by default for Cloudflare Tunnel or local reverse proxy
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - staging-backend-network
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  staging-backend-network:
    driver: bridge

  staging-infrastructure-network:
    driver: bridge

# ==============================================================================
# VOLUMES (Isolated Staging Persistence)
# ==============================================================================

volumes:
  postgres-staging-data:
  redis-staging-data:
  rabbitmq-staging-data:

secrets:
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-C:/Users/Asus/.lumiere/redis_password.txt}
