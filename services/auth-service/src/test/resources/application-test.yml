spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

app:
  security:
    jwt:
      secret: "dummySecretForTestingThatIsAtLeast32BytesLong"
      expiration-ms: 900000
      refresh-expiration-ms: 604800000
    cookie:
      secure: false
      same-site: Strict
      domain: ""
      path: /api/v1/auth
    csrf:
      allowed-origins: ""
  bootstrap:
    admin:
      email: ""
      password: ""
