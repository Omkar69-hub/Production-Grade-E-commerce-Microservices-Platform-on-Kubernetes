name: Load Test

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration of load test (e.g., 30s)'
        required: true
        default: '1m'
      users:
        description: 'Target virtual users (VUs)'
        required: true
        default: '50'

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose -f docker/docker-compose.dev.yml up -d
          
      - name: Wait for API Gateway
        run: |
          echo "Waiting for API Gateway to be healthy..."
          timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8088/actuator/health)" != "200" ]]; do sleep 5; done' || false
          echo "API Gateway is healthy!"

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run K6 Load Test
        env:
          BASE_URL: http://localhost:8088
        run: |
          k6 run tests/load/k6-load-test.js
          
      - name: View Service Logs (On Failure)
        if: failure()
        run: |
          docker compose -f docker/docker-compose.dev.yml logs
